      <stop offset="30%" stop-color="#dcecff"/>
      <stop offset="58%" stop-color="#e9e6ff"/>
      <stop offset="78%" stop-color="#f4e7fa"/>
      <stop offset="100%" stop-color="#f8edf3"/>
