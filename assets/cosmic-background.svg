    <radialGradient id="nebulaA" cx="72%" cy="18%" r="54%">
      <stop offset="0%" stop-color="#8dc8ff" stop-opacity=".92"/>
      <stop offset="28%" stop-color="#b8d9ff" stop-opacity=".74"/>
      <stop offset="56%" stop-color="#cfc9ff" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#cfc9ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaB" cx="84%" cy="58%" r="48%">
      <stop offset="0%" stop-color="#ffd59d" stop-opacity=".75"/>
